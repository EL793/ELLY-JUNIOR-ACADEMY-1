<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password - Elly Junior Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f4f7fb;

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;
    }


    .box {

      width: 90%;

      max-width: 400px;

      background: white;

      padding: 30px;

      border-radius: 15px;

      box-shadow:
        0 5px 25px rgba(0,0,0,0.15);

      text-align: center;

      box-sizing: border-box;
    }


    h1 {

      color: #16803c;

      margin-bottom: 20px;
    }


    input {

      width: 100%;

      box-sizing: border-box;

      padding: 14px;

      margin: 10px 0;

      border: 1px solid #ccc;

      border-radius: 8px;

      font-size: 16px;
    }


    button {

      width: 100%;

      padding: 14px;

      margin-top: 10px;

      background: #16803c;

      color: white;

      border: none;

      border-radius: 8px;

      font-size: 16px;

      cursor: pointer;
    }


    #message {

      margin-top: 15px;

      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="box">

    <h1>ELLY JUNIOR ACADEMY</h1>

    <p>Create your new password</p>


    <input
      type="password"
      id="password"
      placeholder="New password"
    >


    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
    >


    <button onclick="updatePassword()">
      CHANGE PASSWORD
    </button>


    <p id="message"></p>

  </div>


  <script>

    const SUPABASE_URL =
      "https://bhkzjwdwcwnlzlbpyeak.supabase.co";


    const SUPABASE_ANON_KEY =
      "sb_publishable_uEFokNrcALGVfo-M9l-z2g_z1tz9_8K";


    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    async function updatePassword() {

      const password =
        document.getElementById("password")
        .value;


      const confirmPassword =
        document.getElementById("confirmPassword")
        .value;


      const message =
        document.getElementById("message");


      if (!password || !confirmPassword) {

        message.textContent =
          "Please enter your new password.";

        message.style.color =
          "red";

        return;
      }


      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        message.style.color =
          "red";

        return;
      }


      if (password !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        message.style.color =
          "red";

        return;
      }


      message.textContent =
        "Changing password...";


      try {

        const { error } =
          await db.auth.updateUser({

            password: password

          });


        if (error) {

          message.textContent =
            error.message;

          message.style.color =
            "red";

          return;
        }


        message.textContent =
          "Password changed successfully!";

        message.style.color =
          "green";


        setTimeout(function() {

          window.location.href =
            "index.html";

        }, 2000);


      } catch (error) {

        message.textContent =
          "Error: " + error.message;

        message.style.color =
          "red";
      }

    }

  </script>

</body>

</html>
