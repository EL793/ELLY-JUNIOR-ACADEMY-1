<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elly Junior Academy - Login</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      color: #16803c;
      margin-bottom: 5px;
    }

    p {
      color: #666;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #16803c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #10652f;
    }

    .register-button {
      background: #333;
    }

    .register-button:hover {
      background: #222;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .forgot {
      margin-top: 15px;
      color: #16803c;
      cursor: pointer;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .register-link {
      margin-top: 18px;
      color: #16803c;
      cursor: pointer;
      font-weight: bold;
    }

    .register-link:hover {
      text-decoration: underline;
    }

    #confirmPassword {
      display: none;
    }

    #registerButton {
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>ELLY JUNIOR ACADEMY</h1>

    <p id="formTitle">Student / User Login</p>

    <!-- EMAIL -->
    <input
      type="email"
      id="email"
      placeholder="Email address"
      required
    >

    <!-- PASSWORD -->
    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <!-- CONFIRM PASSWORD - ONLY FOR REGISTRATION -->
    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm password"
    >

    <!-- LOGIN BUTTON -->
    <button id="loginButton" onclick="login()">
      LOGIN
    </button>

    <!-- REGISTER BUTTON -->
    <button
      id="registerButton"
      class="register-button"
      onclick="registerUser()">
      CREATE ACCOUNT
    </button>

    <!-- FORGOT PASSWORD -->
    <div
      class="forgot"
      onclick="resetPassword()">
      Forgot password?
    </div>

    <!-- SWITCH LOGIN / REGISTER -->
    <div
      class="register-link"
      id="switchMode"
      onclick="showRegister()">
      Don't have an account? Create one
    </div>

    <!-- MESSAGE -->
    <p id="message"></p>

  </div>


  <script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
      "https://bhkzjwdwcwnlzlbpyeak.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_uEFokNrcALGVfo-M9l-z2g_z1tz9_8K";

    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // ==========================================
    // LOGIN
    // ==========================================

    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");


      // Check fields
      if (!email || !password) {

        message.textContent =
          "Please enter your email and password.";

        message.style.color = "red";

        return;
      }


      message.textContent =
        "Logging in...";

      message.style.color =
        "#16803c";


      try {

        const { data, error } =
          await db.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          message.textContent =
            error.message;

          message.style.color =
            "red";

          return;
        }


        message.textContent =
          "Login successful!";

        message.style.color =
          "green";


        // Go to dashboard
        window.location.href =
          "dashboard.html";


      } catch (error) {

        message.textContent =
          "Login failed: " + error.message;

        message.style.color =
          "red";

        console.error(error);
      }
    }


    // ==========================================
    // SHOW REGISTRATION FORM
    // ==========================================

    function showRegister() {

      document.getElementById("formTitle").textContent =
        "Create Student / User Account";

      document.getElementById("confirmPassword").style.display =
        "block";

      document.getElementById("loginButton").style.display =
        "none";

      document.getElementById("registerButton").style.display =
        "block";

      document.getElementById("switchMode").textContent =
        "Already have an account? Login";

      document.getElementById("switchMode").onclick =
        showLogin;

      document.getElementById("message").textContent =
        "";
    }


    // ==========================================
    // SHOW LOGIN FORM
    // ==========================================

    function showLogin() {

      document.getElementById("formTitle").textContent =
        "Student / User Login";

      document.getElementById("confirmPassword").style.display =
        "none";

      document.getElementById("loginButton").style.display =
        "block";

      document.getElementById("registerButton").style.display =
        "none";

      document.getElementById("switchMode").textContent =
        "Don't have an account? Create one";

      document.getElementById("switchMode").onclick =
        showRegister;

      document.getElementById("message").textContent =
        "";
    }


    // ==========================================
    // REGISTER NEW USER
    // ==========================================

    async function registerUser() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("message");


      // Check email and password
      if (!email || !password || !confirmPassword) {

        message.textContent =
          "Please fill in all fields.";

        message.style.color =
          "red";

        return;
      }


      // Check password length
      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        message.style.color =
          "red";

        return;
      }


      // Check passwords match
      if (password !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        message.style.color =
          "red";

        return;
      }


      message.textContent =
        "Creating account...";

      message.style.color =
        "#16803c";


      try {

        const { data, error } =
          await db.auth.signUp({

            email: email,

            password: password,

            options: {

              emailRedirectTo:
                window.location.origin

            }

          });


        if (error) {

          message.textContent =
            error.message;
