<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elly Junior Academy - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      color: #16803c;
      margin-bottom: 5px;
    }

    p {
      color: #666;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #16803c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #10652f;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .forgot {
      margin-top: 15px;
      color: #16803c;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>ELLY JUNIOR ACADEMY</h1>
    <p>Student / User Login</p>

    <input
      type="email"
      id="email"
      placeholder="Email address"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button onclick="login()">LOGIN</button>

    <div class="forgot" onclick="resetPassword()">
      Forgot password?
    </div>

    <p id="message"></p>
  </div>

  <script>
    // ==============================
 
    // ==============================

    const SUPABASE_URL = "bhkzjwdwcwnlzlbpyeak";
    const SUPABASE_ANON_KEY = "sb_publishable_uEFokNrcALGVfo-M9l-z2g_z1tz9_8K";

    const { createClient } =
      supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    // LOGIN
    async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!email || !password) {
        message.textContent = "Please enter your email and password.";
        message.style.color = "red";
        return;
    }

    message.textContent = "Logging in...";
    message.style.color = "black";

    try {
        const loginRequest = db.auth.signInWithPassword({
            email: email,
            password: password
        });

        const timeout = new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Login request timed out. Check your Supabase settings.")), 10000)
        );

        const { data, error } = await Promise.race([
            loginRequest,
            timeout
        ]);

        if (error) {
            message.textContent = error.message;
            message.style.color = "red";
            return;
        }

        message.textContent = "Login successful!";
        message.style.color = "green";

        window.location.href = "dashboard.html";

    } catch (error) {
        message.textContent = "Login failed: " + error.message;
        message.style.color = "red";
        console.error(error);
    }
}

      message.textContent = "Logging in...";
      message.style.color = "#16803c";

      const { data, error } =
        await db.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.textContent = error.message;
        message.style.color = "red";
        return;
      }

      message.textContent = "Login successful!";
      message.style.color = "green";

      // Change this later to your dashboard page
      window.location.href = "dashboard.html";
    }

    // PASSWORD RESET
    async function resetPassword() {

      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message");

      if (!email) {
        message.textContent =
          "Enter your email address first.";
        message.style.color = "red";
        return;
      }

      const { error } =
        await db.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin
        });

      if (error) {
        message.textContent = error.message;
        message.style.color = "red";
      } else {
        message.textContent =
          "Password reset email sent.";
        message.style.color = "green";
      }
    }
  </script>

</body>
</html>
