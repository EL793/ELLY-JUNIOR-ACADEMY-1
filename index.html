<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elly Junior Academy Management</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #123c69;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    header span {
      font-size: 13px;
      opacity: .9;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 70px);
    }

    nav {
      width: 220px;
      background: white;
      border-right: 1px solid #ddd;
      padding: 20px 12px;
    }

    nav button {
      width: 100%;
      padding: 13px;
      margin-bottom: 8px;
      border: none;
      background: transparent;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    nav button:hover,
    nav button.active {
      background: #e8f1fb;
      color: #123c69;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 25px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin: 20px 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }

    .card h3 {
      font-size: 14px;
      color: #667085;
      margin-bottom: 10px;
    }

    .card strong {
      font-size: 28px;
      color: #123c69;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 13px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f7f9fc;
    }

    .btn {
      background: #123c69;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 10px;
    }

    input, select {
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      margin: 5px;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      nav {
        width: 160px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ELLY JUNIOR ACADEMY</h1>
  <span>School Management System</span>
</header>

<div class="layout">

  <nav>
    <button class="active" onclick="showPage('dashboard', this)">📊 Dashboard</button>
    <button onclick="showPage('students', this)">👨‍🎓 Students</button>
    <button onclick="showPage('classes', this)">🏫 Classes</button>
    <button onclick="showPage('attendance', this)">✅ Attendance</button>
    <button onclick="showPage('fees', this)">💰 Fees</button>
    <button onclick="showPage('teachers', this)">👩‍🏫 Teachers</button>
    <button onclick="showPage('settings', this)">⚙️ Settings</button>
  </nav>

  <main>

    <section id="dashboard" class="page active">

      <p>Welcome to Elly Junior Academy Management System.</p>

          <strong id="studentCount">0</strong>

        <div class="card">
          <h3>Classes</h3>
          <strong>0</strong>
        </div>

        <div class="card">
          <h3>Teachers</h3>
          <strong>0</strong>
        </div>

        <div class="card">
          <h3>Fees Collected</h3>
          <strong>KSh 0</strong>
        </div>
      </div>

      <div class="panel">
        <h3>Quick Actions</h3>
        <button class="btn" onclick="showPage('students')">
          Add Student
        </button>
        <button class="btn" onclick="showPage('attendance')">
          Record Attendance
        </button>
      </div>
    </section>

    <!-- STUDENTS -->
    <section id="students" class="page">

      <div class="panel">

          <option>Grade 8</option>
          <option>Grade 9</option>
