<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elly Junior Academy - Create Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .register-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      color: #16803c;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #16803c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #10652f;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.4;
    }

    .back-login {
      margin-top: 20px;
      color: #16803c;
      cursor: pointer;
      font-weight: bold;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <h1>ELLY JUNIOR ACADEMY</h1>

    <p class="subtitle">
      Create Student / User Account
    </p>

    <input
      type="text"
      id="fullName"
      placeholder="Full name"
      autocomplete="name"
    >

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Create password"
      autocomplete="new-password"
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm password"
      autocomplete="new-password"
    >

    <button type="button" id="registerButton">
      CREATE ACCOUNT
    </button>

    <p id="message"></p>

    <div class="back-login" id="loginLink">
      Already have an account? Login
    </div>

  </div>
