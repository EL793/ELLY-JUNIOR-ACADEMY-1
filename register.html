<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elly Junior Academy - Create Account</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .register-box {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      color: #16803c;
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
      font-size: 17px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #16803c;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: #16803c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #10652f;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.4;
    }

    .back-login {
      margin-top: 20px;
      color: #16803c;
      cursor: pointer;
      font-weight: bold;
      font-size: 17px;
    }

    .back-login:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <h1>ELLY JUNIOR ACADEMY</h1>

    <p class="subtitle">
      Create Student / User Account
    </p>

    <input
      type="text"
      id="fullName"
      placeholder="Full name"
      autocomplete="name"
    >

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Create password"
      autocomplete="new-password"
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm password"
      autocomplete="new-password"
    >

    <button type="button" id="registerButton">
      CREATE ACCOUNT
    </button>

    <p id="message"></p>

    <div class="back-login" id="loginLink">
      Already have an account? Login
    </div>

  </div>


  <script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
      "https://bhkzjwdwcwnlzlbpyeak.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_uEFokNrcALGVfo-M9l-z2g_z1tz9_8K";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // ==========================================
    // REGISTER USER
    // ==========================================

    async function register() {

      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("message");

      const button =
        document.getElementById("registerButton");


      // ------------------------------------------
      // CHECK EMPTY FIELDS
      // ------------------------------------------

      if (
        !fullName ||
        !email ||
        !password ||
        !confirmPassword
      ) {

        message.textContent =
          "Please fill in all fields.";

        message.style.color = "red";

        return;
      }


      // ------------------------------------------
      // CHECK PASSWORD LENGTH
      // ------------------------------------------

      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        message.style.color = "red";

        return;
      }


      // ------------------------------------------
      // CHECK PASSWORD MATCH
      // ------------------------------------------

      if (password !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        message.style.color = "red";

        return;
      }


      // ------------------------------------------
      // STARTING
      // ------------------------------------------

      button.disabled = true;

      button.textContent =
        "CREATING ACCOUNT...";

      message.textContent =
        "Creating account...";

      message.style.color =
        "#16803c";


      try {

        // ----------------------------------------
        // CREATE SUPABASE ACCOUNT
        // ----------------------------------------

        const { data, error } =
          await db.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                full_name: fullName
              },

              emailRedirectTo:
                window.location.origin +
                "/ELLY-JUNIOR-ACADEMY-1/index.html"

            }

          });


        // ----------------------------------------
        // ERROR
        // ----------------------------------------

        if (error) {

          console.error(
            "Supabase error:",
            error
          );

          message.textContent =
            error.message;

          message.style.color =
            "red";

          button.disabled = false;

          button.textContent =
            "CREATE ACCOUNT";

          return;
        }


        // ----------------------------------------
        // EMAIL CONFIRMATION REQUIRED
        // ----------------------------------------

        if (data.user && !data.session) {

          message.textContent =
            "Account created successfully! Please check your email and confirm your account.";

          message.style.color =
            "green";

          button.disabled = false;

          button.textContent =
            "CREATE ACCOUNT";

          return;
        }


        // ----------------------------------------
        // SUCCESS
        // ----------------------------------------

        message.textContent =
          "Account created successfully!";

        message.style.color =
          "green";


        button.textContent =
          "ACCOUNT CREATED";


        // Go to login page

        setTimeout(function() {

          window.location.href =
            "index.html";

        }, 1500);


      } catch (error) {

        console.error(
          "Registration error:",
          error
        );

        message.textContent =
          "Registration failed: " +
          error.message;

        message.style.color =
          "red";

        button.disabled = false;

        button.textContent =
          "CREATE ACCOUNT";
      }

    }


    // ==========================================
    // CREATE ACCOUNT BUTTON
    // ==========================================

    document
      .getElementById("registerButton")
      .addEventListener(
        "click",
        register
      );


    // ==========================================
    // LOGIN LINK
    // ==========================================

    document
      .getElementById("loginLink")
      .addEventListener(
        "click",
        function() {

          window.location.href =
            "index.html";

        }
      );

  </script>

</body>
</html>
