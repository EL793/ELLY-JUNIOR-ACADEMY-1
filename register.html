<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elly Junior Academy - Create Account</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0f1216;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: #1f1f1f;
            border-radius: 25px;
            padding: 40px 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35);
        }

        h1 {
            text-align: center;
            color: #6ee7a0;
            font-size: 36px;
            margin: 0 0 15px;
        }

        .subtitle {
            text-align: center;
            color: #bbb;
            font-size: 20px;
            margin-bottom: 30px;
        }

        input,
        select {
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 15px;
            border: 1px solid #555;
            background: #292929;
            color: white;
            font-size: 17px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #00d639;
        }

        select option {
            background: #292929;
            color: white;
        }

        button {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            border: none;
            border-radius: 15px;
            background: #006b1b;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #008522;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .login {
            text-align: center;
            margin-top: 25px;
        }

        .login a {
            color: #6ee7a0;
            font-weight: bold;
            text-decoration: none;
        }

        #message {
            display: none;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 16px;
        }

        .success {
            display: block !important;
            background: #063d18;
            color: #72f29d;
        }

        .error {
            display: block !important;
            background: #4a1111;
            color: #ff8b8b;
        }

        .section-title {
            color: #6ee7a0;
            font-size: 18px;
            margin: 20px 0 10px;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ELLY JUNIOR<br>ACADEMY</h1>

    <div class="subtitle">Create Student / User Account</div>

    <div id="message"></div>

    <form id="registerForm">

        <!-- LOGIN DETAILS -->
        <div class="section-title">Account Details</div>

        <input
            type="text"
            id="fullName"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            minlength="6"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            minlength="6"
            required
        >

        <!-- STUDENT DETAILS -->
        <div class="section-title">Student Details</div>

        <input
            type="text"
            id="admissionNumber"
            placeholder="Admission Number (optional)"
        >

        <input
            type="date"
            id="dateOfBirth"
        >

        <select id="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <input
            type="text"
            id="className"
            placeholder="Class (optional)"
        >

        <!-- PARENT DETAILS -->
        <div class="section-title">Parent / Guardian Details</div>

        <input
            type="text"
            id="parentName"
            placeholder="Parent / Guardian Name (optional)"
        >

        <input
            type="tel"
            id="parentPhone"
            placeholder="Parent / Guardian Phone (optional)"
        >

        <input
            type="text"
            id="address"
            placeholder="Address (optional)"
        >

        <button type="submit" id="registerButton">
            CREATE ACCOUNT
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

    // =========================================================
    // SUPABASE CONNECTION
    // =========================================================

    const SUPABASE_URL =
        "https://bhkzjwdwcwnzlzbpyeak.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_uEFokNrcALGVfO-M91-22g_z1tz9_8K";

    const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    // =========================================================
    // MESSAGE FUNCTION
    // =========================================================

    function showMessage(text, type) {

        const message = document.getElementById("message");

        message.textContent = text;

        message.className = type;

        message.style.display = "block";
    }


    // =========================================================
    // REGISTRATION
    // =========================================================

    document
        .getElementById("registerForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const button =
                document.getElementById("registerButton");

            button.disabled = true;
            button.textContent = "CREATING ACCOUNT...";


            try {

                // ---------------------------------------------
                // GET FORM VALUES
                // ---------------------------------------------

                const fullName =
                    document.getElementById("fullName").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const admissionNumber =
                    document.getElementById("admissionNumber").value.trim();

                const dateOfBirth =
                    document.getElementById("dateOfBirth").value || null;

                const gender =
                    document.getElementById("gender").value || null;

                const className =
                    document.getElementById("className").value.trim() || null;

                const parentName =
                    document.getElementById("parentName").value.trim() || null;

                const parentPhone =
                    document.getElementById("parentPhone").value.trim() || null;

                const address =
                    document.getElementById("address").value.trim() || null;


                // ---------------------------------------------
                // CHECK NAME
                // ---------------------------------------------

                if (!fullName) {
                    throw new Error("Please enter the student's full name.");
                }


                // ---------------------------------------------
                // CHECK PASSWORDS
                // ---------------------------------------------

                if (password.length < 6) {
                    throw new Error(
                        "Password must contain at least 6 characters."
                    );
                }

                if (password !== confirmPassword) {
                    throw new Error(
                        "The passwords do not match."
                    );
                }


                // ---------------------------------------------
                // SPLIT FULL NAME
                // ---------------------------------------------

                const nameParts =
                    fullName.split(/\s+/);

                const firstName =
                    nameParts.shift();

                const lastName =
                    nameParts.join(" ") || null;


                // ---------------------------------------------
                // CREATE SUPABASE AUTH ACCOUNT
                // ---------------------------------------------

                const {
                    data: authData,
                    error: authError
                } = await db.auth.signUp({

                    email: email,

                    password: password,

                    options: {
                        data: {
                            full_name: fullName
                        }
                    }
                });


                if (authError) {
                    throw authError;
                }


                // ---------------------------------------------
                // CREATE STUDENT RECORD
                // ---------------------------------------------

                const {
                    error: studentError
                } = await db
                    .from("STUDENTS")
                    .insert({

                        admission_number:
                            admissionNumber || null,

                        first_name:
                            firstName,

                        last_name:
                            lastName,

                        date_of_birth:
                            dateOfBirth,

                        gender:
                            gender,

                        class_name:
                            className,

                        parent_name:
                            parentName,

                        parent_phone:
                            parentPhone,

                        address:
                            address
                    });


                if (studentError) {

                    console.error(
                        "Student database error:",
                        studentError
                    );

                    throw new Error(
                        "Account was created, but the student record could not be saved. " +
                        studentError.message
                    );
                }


                // ---------------------------------------------
                // SUCCESS
                // ---------------------------------------------

                showMessage(
                    "Account created successfully! You can now log in.",
                    "success"
                );

                document
                    .getElementById("registerForm")
                    .reset();


                // Give the user time to see the message
                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 2000);


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Something went wrong. Please try again.",
                    "error"
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    "CREATE ACCOUNT";
            }

        });

</script>

</body>
</html>
